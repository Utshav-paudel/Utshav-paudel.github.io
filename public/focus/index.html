<body>
<header class="toolbar">

    <div class="bar1">
      <div class="file"><span class="dots" aria-hidden="true"><i></i><i></i><i></i></span><span id="filename">focus.ipynb</span></div>
      <nav id="tabs" class="tabs" aria-label="Sections" hidden>
        <button data-view="today" class="on">today</button>
        <button data-view="lessons">lessons</button>
        <button data-view="apps">applications</button>
        <button data-view="settings">settings</button>
      </nav>
      <div class="tools">
        <button id="themeBtn" class="icon" type="button" aria-label="Toggle theme">
          <svg class="moon" viewBox="0 0 24 24" width="15" height="15" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>

        <button id="lockBtn" class="icon" type="button" aria-label="Lock" hidden>

    <div class="bar2">

      <span class="kernel"><i id="kdot"></i><span id="sync">kernel: utshav · locked</span></span>

</header>

<main class="wrap page">
  <article id="lock" class="nb">
    <div class="cell md first"><div class="cc"></div><div class="cb">
      <h1 class="title">Focus Board</h1>
      <p class="lede">Private notebook. Lessons, applications and the trek plan, encrypted until you run the cell below.</p>
    </div></div>
    <form id="lockForm" class="cell code" autocomplete="off"><div class="cc in">In [ ]:</div><div class="cb">
      <label for="pw" class="code-line"><span class="kw">unlock</span>(<span class="str">password</span>=</label>
      <div class="pw-row"><input id="pw" type="password" placeholder="••••••••••••" autocomplete="current-password" required autofocus><span class="code-line">)</span></div>
      <button id="unlockBtn" type="submit" class="run">▶ Run</button>
    </div></form>
    <div class="cell out" id="lockOut" hidden><div class="cc outc">Out[1]:</div><div class="cb"><pre id="lockMsg" class="err"></pre></div></div>
  </article>

  <article id="app" class="nb" hidden></article>
</main>

<footer class="wrap foot"><span>utshav · focus board</span><span>AES-256-GCM · nothing leaves this page unencrypted</span></footer>
<div id="toast" class="toast" role="status" hidden></div>
